# AutoTest 独立版前端 Nginx 配置（Dockerfile.web 内置；拓扑 B：同域反代，设计 §13.4）
# 上游服务名 server 来自 docker-compose 的服务名；裸机部署请改为 127.0.0.1:3280。
server {
    listen 80;
    server_name _;

    # ---- 静态 SPA ----
    root /usr/share/nginx/html;
    index index.html;

    # config.js：部署期可编辑（改 apiBase/wsBase 无需重建镜像/前端），必须 no-cache
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # hashed 资产长缓存；其余（index.html 等）每次校验
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # WebSocket：/api/autotest/ws 先于普通 API 段匹配（正则 location 优先于前缀 location）
    location ~ ^/api/autotest/ws$ {
        proxy_pass http://server:3280;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # WS 长连接：默认 60s 会踢空闲连接
        proxy_send_timeout 300s;
    }

    # 普通 API：同域反代（无 CORS；后端同源闸门看到 Origin host == Host 自然放行）
    location /api/autotest/ {
        proxy_pass http://server:3280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # LLM 分析/执行类接口耗时较长
    }

    # SPA 回退：hash 路由之外的路径回 index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
