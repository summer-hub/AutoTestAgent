name: build-and-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            autotest/package-lock.json
            autotest/dsh-autotest/package-lock.json

      - name: Install workspace deps
        working-directory: autotest
        run: npm ci

      - name: Install plugin deps
        working-directory: autotest/dsh-autotest
        run: npm ci

      # ---- 质量门禁：先卡住再打包，避免把类型错误/回归发出去 ----

      - name: Typecheck (web + plugin)
        working-directory: autotest
        run: npm run typecheck

      - name: Data layer self-check（事务隔离 / 归档列 / 密钥脱敏 / 运行态清理）
        working-directory: autotest/dsh-autotest
        run: npm run build && npm run verify:data

      - name: API guard self-check（同源闸门 / 体积上限 / 入参校验 / 缓存一致性）
        working-directory: autotest/dsh-autotest
        run: npm run verify:api

      - name: Explorer rules self-check（候选判定 / 去重 / 控件分类 / 预算 / 覆盖率报告）
        working-directory: autotest/dsh-autotest
        run: npm run verify:explorer

      - name: Repo paths self-check（仓库地址拆分 / 子目录穿越防护 / 同仓共享克隆）
        working-directory: autotest/dsh-autotest
        run: npm run verify:repo-paths

      - name: Library sheet self-check（xlsx 解析 / 同步计划 / 幂等 / 不覆盖 Agent 字段）
        working-directory: autotest/dsh-autotest
        run: npm run verify:sheet

      - name: API extract self-check（导出链解析 / 定义提取 / 假覆盖防护）
        working-directory: autotest/dsh-autotest
        run: npm run verify:api-extract

      - name: Coverage matrix self-check（状态判定规则表 / 风险标记 / 导出）
        working-directory: autotest/dsh-autotest
        run: npm run verify:coverage

      - name: Case plan self-check（适用性 / 数量模型 / 优先级 / 显式抽样）
        working-directory: autotest/dsh-autotest
        run: npm run verify:case-plan

      - name: Testability self-check（A/B/C/D 判定 / 补丁应用与回退 / 目录穿越防护）
        working-directory: autotest/dsh-autotest
        run: npm run verify:testability

      - name: Oracle self-check（oracle 校验 / 伪判据拦截 / 反假通过）
        working-directory: autotest/dsh-autotest
        run: npm run verify:oracle

      - name: Automation triage self-check（分流规则 / 阻塞类别 / 时长阈值 / 明确归属）
        working-directory: autotest/dsh-autotest
        run: npm run verify:automation

      - name: Script binding self-check（未映射即失败 / 空断言拦截 / 版本联动）
        working-directory: autotest/dsh-autotest
        run: npm run verify:binding

      - name: Knowledge + agent binding self-check（无向量检索 / 生命周期 / 阶段契约 / MCP 工具）
        working-directory: autotest/dsh-autotest
        run: npm run verify:knowledge

      - name: Case link self-check（初版用例↔接口关联 / 矩阵看得见初版用例 / 人工确认不被覆盖）
        working-directory: autotest/dsh-autotest
        run: npm run verify:case-link

      - name: Oracle runtime self-check（需要装了 hypium 的 Python，缺失自动跳过）
        working-directory: autotest/dsh-autotest
        run: npm run verify:oracle-runtime

      - name: Step contract self-check（句式映射 / guardrail，无设备自动跳过真机组）
        working-directory: autotest/dsh-autotest
        run: node scripts/verify-step-contract.mjs

      - name: Build embed frontend
        working-directory: autotest
        run: npm run build:embed

      - name: Build plugin
        working-directory: autotest/dsh-autotest
        run: npm run build

      # 仓库同时提交了 lib/ 产物（README 的 git 直装路径依赖它）。这里重建后校验一致性：
      # 忘记重建就提交，会让"git 直装"的用户拿到与源码不符的旧构建。
      - name: Verify committed lib/ matches sources
        run: |
          # --ignore-cr-at-eol：本门禁管的是"产物是否陈旧"，不该被 CRLF/LF 差异误伤
          if ! git diff --quiet --ignore-cr-at-eol -- autotest/dsh-autotest/lib; then
            echo "::error::autotest/dsh-autotest/lib 与源码不一致。请在本地执行 'npm run build:plugin' 后一并提交产物。"
            git --no-pager diff --stat --ignore-cr-at-eol -- autotest/dsh-autotest/lib
            exit 1
          fi
          echo "lib/ 产物与源码一致"

      # tag 与 package.json 版本必须对齐：否则会出现 v0.1.60 的 Release 里装着 0.1.58 的 tgz
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./autotest/dsh-autotest/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $PKG_VERSION 不一致"
            exit 1
          fi
          echo "版本一致：$PKG_VERSION"

      - name: Pack plugin tarball
        working-directory: autotest/dsh-autotest
        run: npm pack

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" autotest/dsh-autotest/dsh-autotest-*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsh-autotest $GITHUB_REF_NAME" \
            --generate-notes
